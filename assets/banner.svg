<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060A14"/>
      <stop offset="50%" style="stop-color:#080D18"/>
      <stop offset="100%" style="stop-color:#0A1020"/>
    </linearGradient>
    
    <!-- Glow filter for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle glow for lines -->
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse animation for nodes -->
    <style>
      @keyframes pulse1 { 0%,100%{opacity:0.4;r:3} 50%{opacity:1;r:5} }
      @keyframes pulse2 { 0%,100%{opacity:0.3;r:2.5} 50%{opacity:0.9;r:4.5} }
      @keyframes pulse3 { 0%,100%{opacity:0.5;r:3.5} 50%{opacity:1;r:5.5} }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      @keyframes fadePulse { 0%,100%{opacity:0.15} 50%{opacity:0.35} }
      @keyframes textGlow { 0%,100%{opacity:0.9} 50%{opacity:1} }
      @keyframes scanline { 0%{transform:translateY(-300px)} 100%{transform:translateY(300px)} }
      @keyframes nodeFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(2px,-3px)} }
      @keyframes nodeFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-2px,2px)} }
      
      .node-p1 { animation: pulse1 3s ease-in-out infinite; }
      .node-p2 { animation: pulse2 4s ease-in-out infinite 0.5s; }
      .node-p3 { animation: pulse3 3.5s ease-in-out infinite 1s; }
      .circuit-line { animation: dash 2s linear infinite; }
      .fade-pulse { animation: fadePulse 4s ease-in-out infinite; }
      .text-glow { animation: textGlow 3s ease-in-out infinite; }
      .float1 { animation: nodeFloat1 6s ease-in-out infinite; }
      .float2 { animation: nodeFloat2 5s ease-in-out infinite 1s; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  
  <!-- Scanline effect -->
  <rect width="1200" height="2" fill="#3B82F6" opacity="0.03" style="animation: scanline 8s linear infinite"/>
  
  <!-- Grid pattern (subtle) -->
  <g opacity="0.04" stroke="#3B82F6" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- === LEFT SIDE: Circuit Network === -->
  
  <!-- Circuit connection lines -->
  <g filter="url(#lineGlow)">
    <!-- Horizontal circuit traces -->
    <line x1="30" y1="80" x2="120" y2="80" stroke="#3B82F6" stroke-width="1" opacity="0.25" stroke-dasharray="4,4" class="circuit-line"/>
    <line x1="80" y1="140" x2="200" y2="140" stroke="#3B82F6" stroke-width="1" opacity="0.2" stroke-dasharray="6,3" class="circuit-line"/>
    <line x1="50" y1="200" x2="160" y2="200" stroke="#93C5FD" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4" class="circuit-line"/>
    <line x1="100" y1="250" x2="180" y2="250" stroke="#3B82F6" stroke-width="0.8" opacity="0.15" stroke-dasharray="5,3" class="circuit-line"/>
    
    <!-- Vertical circuit traces -->
    <line x1="120" y1="60" x2="120" y2="160" stroke="#3B82F6" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,6" class="circuit-line"/>
    <line x1="200" y1="100" x2="200" y2="220" stroke="#93C5FD" stroke-width="0.8" opacity="0.15" stroke-dasharray="3,5" class="circuit-line"/>
    
    <!-- Diagonal connections -->
    <line x1="120" y1="80" x2="200" y2="140" stroke="#3B82F6" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4" class="circuit-line"/>
    <line x1="160" y1="200" x2="200" y2="140" stroke="#93C5FD" stroke-width="0.6" opacity="0.15" stroke-dasharray="3,5" class="circuit-line"/>
    <line x1="80" y1="140" x2="50" y2="200" stroke="#3B82F6" stroke-width="0.6" opacity="0.15" stroke-dasharray="4,4" class="circuit-line"/>
  </g>
  
  <!-- Circuit nodes (left) -->
  <g filter="url(#glow)">
    <circle cx="30" cy="80" r="3" fill="#3B82F6" class="node-p1 float1"/>
    <circle cx="120" cy="80" r="4" fill="#3B82F6" class="node-p2"/>
    <circle cx="80" cy="140" r="3" fill="#93C5FD" class="node-p3 float2"/>
    <circle cx="200" cy="140" r="4.5" fill="#3B82F6" class="node-p1"/>
    <circle cx="50" cy="200" r="3" fill="#93C5FD" class="node-p2 float1"/>
    <circle cx="160" cy="200" r="3.5" fill="#3B82F6" class="node-p3"/>
    <circle cx="200" cy="220" r="2.5" fill="#93C5FD" class="node-p1 float2"/>
    <circle cx="100" cy="250" r="2.5" fill="#3B82F6" class="node-p2"/>
    <circle cx="180" cy="250" r="3" fill="#93C5FD" class="node-p3 float1"/>
    <circle cx="120" cy="60" r="2" fill="#3B82F6" class="node-p1"/>
  </g>

  <!-- === RIGHT SIDE: Network Nodes === -->
  
  <!-- Network connection lines -->
  <g filter="url(#lineGlow)">
    <line x1="950" y1="70" x2="1050" y2="120" stroke="#3B82F6" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4" class="circuit-line"/>
    <line x1="1050" y1="120" x2="1150" y2="80" stroke="#93C5FD" stroke-width="0.8" opacity="0.18" stroke-dasharray="3,5" class="circuit-line"/>
    <line x1="1050" y1="120" x2="1000" y2="200" stroke="#3B82F6" stroke-width="0.8" opacity="0.2" stroke-dasharray="5,3" class="circuit-line"/>
    <line x1="1000" y1="200" x2="1100" y2="230" stroke="#93C5FD" stroke-width="0.6" opacity="0.15" stroke-dasharray="4,4" class="circuit-line"/>
    <line x1="1100" y1="230" x2="1150" y2="170" stroke="#3B82F6" stroke-width="0.6" opacity="0.18" stroke-dasharray="3,5" class="circuit-line"/>
    <line x1="1150" y1="170" x2="1150" y2="80" stroke="#3B82F6" stroke-width="0.6" opacity="0.15" stroke-dasharray="4,6" class="circuit-line"/>
    <line x1="950" y1="70" x2="1000" y2="200" stroke="#3B82F6" stroke-width="0.6" opacity="0.12" stroke-dasharray="6,4" class="circuit-line"/>
    <line x1="980" y1="260" x2="1100" y2="230" stroke="#93C5FD" stroke-width="0.6" opacity="0.12" stroke-dasharray="4,6" class="circuit-line"/>
    <line x1="980" y1="260" x2="1000" y2="200" stroke="#3B82F6" stroke-width="0.6" opacity="0.15" stroke-dasharray="3,5" class="circuit-line"/>
  </g>
  
  <!-- Network nodes (right) -->
  <g filter="url(#glow)">
    <circle cx="950" cy="70" r="3.5" fill="#3B82F6" class="node-p2 float2"/>
    <circle cx="1050" cy="120" r="4.5" fill="#3B82F6" class="node-p1"/>
    <circle cx="1150" cy="80" r="3" fill="#93C5FD" class="node-p3 float1"/>
    <circle cx="1000" cy="200" r="4" fill="#3B82F6" class="node-p2"/>
    <circle cx="1100" cy="230" r="3" fill="#93C5FD" class="node-p1 float2"/>
    <circle cx="1150" cy="170" r="3.5" fill="#3B82F6" class="node-p3"/>
    <circle cx="980" cy="260" r="2.5" fill="#93C5FD" class="node-p2 float1"/>
  </g>

  <!-- === CENTER: Text Content === -->
  
  <!-- Decorative brackets -->
  <text x="340" y="120" font-family="'Courier New', monospace" font-size="40" fill="#3B82F6" opacity="0.3" class="fade-pulse">{</text>
  <text x="840" y="120" font-family="'Courier New', monospace" font-size="40" fill="#3B82F6" opacity="0.3" class="fade-pulse">}</text>
  
  <!-- Main name -->
  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="2" class="text-glow">KRISH JAIN</text>
  
  <!-- Separator line -->
  <line x1="440" y1="135" x2="760" y2="135" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="440" cy="135" r="2.5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="760" cy="135" r="2.5" fill="#3B82F6" opacity="0.6"/>
  
  <!-- Tagline -->
  <text x="600" y="165" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#93C5FD" letter-spacing="3" opacity="0.9">BUILDING THE WEB · ENGINEERING WHAT'S NEXT</text>
  
  <!-- Terminal prompt -->
  <text x="600" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#3B82F6" opacity="0.5" class="fade-pulse">
    <tspan>~/krish</tspan><tspan fill="#93C5FD"> $ </tspan><tspan fill="#ffffff" opacity="0.4">ready</tspan>
  </text>

  <!-- Bottom decorative dots -->
  <g opacity="0.15">
    <circle cx="540" cy="240" r="1.5" fill="#3B82F6"/>
    <circle cx="560" cy="240" r="1.5" fill="#3B82F6"/>
    <circle cx="580" cy="240" r="1.5" fill="#93C5FD"/>
    <circle cx="600" cy="240" r="2" fill="#3B82F6"/>
    <circle cx="620" cy="240" r="1.5" fill="#93C5FD"/>
    <circle cx="640" cy="240" r="1.5" fill="#3B82F6"/>
    <circle cx="660" cy="240" r="1.5" fill="#3B82F6"/>
  </g>
  
  <!-- Corner accents -->
  <g stroke="#3B82F6" stroke-width="1.5" opacity="0.2">
    <!-- Top-left -->
    <line x1="15" y1="15" x2="45" y2="15"/>
    <line x1="15" y1="15" x2="15" y2="45"/>
    <!-- Top-right -->
    <line x1="1155" y1="15" x2="1185" y2="15"/>
    <line x1="1185" y1="15" x2="1185" y2="45"/>
    <!-- Bottom-left -->
    <line x1="15" y1="255" x2="15" y2="285"/>
    <line x1="15" y1="285" x2="45" y2="285"/>
    <!-- Bottom-right -->
    <line x1="1185" y1="255" x2="1185" y2="285"/>
    <line x1="1155" y1="285" x2="1185" y2="285"/>
  </g>
</svg>

