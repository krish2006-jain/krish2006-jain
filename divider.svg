<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#1e6bff" stop-opacity="0"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e6bff" stop-opacity="0"/></linearGradient></defs>
<style>@keyframes slide{0%{transform:translateX(-300px)}100%{transform:translateX(1000px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.b{animation:slide 3s linear infinite}.n{animation:pulse 1.5s ease-in-out infinite}</style>
<rect x="0" y="11" width="1000" height="2" fill="url(#l)" opacity=".5"/>
<rect class="b" x="0" y="10" width="300" height="4" rx="2" fill="url(#l)"/>
<circle class="n" cx="500" cy="12" r="4" fill="#3b82f6"/>
<circle class="n" cx="440" cy="12" r="2.5" fill="#1e6bff" style="animation-delay:.3s"/>
<circle class="n" cx="560" cy="12" r="2.5" fill="#1e6bff" style="animation-delay:.6s"/>
</svg>